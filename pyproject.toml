[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "client-health-score"
version = "0.1.0"
description = "Score agency client accounts on health, flag churn risk and upsell signals, and draft QBRs with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishwajeet Kumbhar" }]
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
clienthealth = "clienthealth.cli:main"

[tool.setuptools]
packages = ["clienthealth"]
